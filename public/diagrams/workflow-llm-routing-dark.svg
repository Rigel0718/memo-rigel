<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Workflow · predefined paths</title>
  <desc id="diagram-desc">Application에서 LLM Routing으로 이동한 뒤 Workflow A, B, C 중 하나를 선택하고 각 Workflow에서 Result로 이동한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2dd4bf"/></marker>
    <marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#60a5fa"/></marker>
  </defs>
  <style>
    .canvas{fill:#0f172a}.node{fill:#1e293b;stroke:#475569;stroke-width:1.5}.active{fill:#134e4a;stroke:#2dd4bf;stroke-width:1.5}
    text{fill:#f1f5f9;font:600 19px ui-sans-serif,system-ui,sans-serif;text-anchor:middle}
    .heading{font-size:26px;text-anchor:start}.eyebrow{fill:#2dd4bf;font:700 13px ui-monospace,monospace;letter-spacing:1.5px;text-anchor:start}
    .label{fill:#2dd4bf;font-size:16px}.return-label{fill:#60a5fa;font-size:16px}
    .edge{fill:none;stroke:#2dd4bf;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .return{fill:none;stroke:#60a5fa;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 5;marker-end:url(#return-arrow)}
  </style>
  <rect class="canvas" width="760" height="410" rx="20"/>
  <text class="eyebrow" x="32" y="36">WORKFLOW · PREDEFINED PATHS</text>
  <text class="heading" x="32" y="73">LLM routing selects a workflow</text>
  <rect class="node" x="32" y="205" width="150" height="64" rx="12"/>
  <text x="107" y="244">Application</text>
  <path class="edge" d="M182 237 H218"/>
  <rect class="active" x="220" y="205" width="168" height="64" rx="12"/>
  <text x="304" y="244">LLM Routing</text>
  <path class="edge" d="M388 237 H410 V139 H438"/>
  <path class="edge" d="M388 237 H438"/>
  <path class="edge" d="M388 237 H410 V335 H438"/>
  <rect class="node" x="440" y="107" width="156" height="64" rx="12"/>
  <text x="518" y="146">Workflow A</text>
  <rect class="node" x="440" y="205" width="156" height="64" rx="12"/>
  <text x="518" y="244">Workflow B</text>
  <rect class="node" x="440" y="303" width="156" height="64" rx="12"/>
  <text x="518" y="342">Workflow C</text>
  <path class="edge" d="M596 139 H614 V237 H638"/>
  <path class="edge" d="M596 237 H638"/>
  <path class="edge" d="M596 335 H614 V237 H638"/>
  <rect class="node" x="640" y="205" width="92" height="64" rx="12"/>
  <text x="686" y="244">Result</text>
</svg>
