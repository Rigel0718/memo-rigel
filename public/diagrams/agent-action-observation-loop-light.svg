<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Agent · action and observation loop</title>
  <desc id="diagram-desc">Goal에서 LLM으로 이동한다. LLM은 Environment에 Action을 수행하고 Environment는 LLM에 Observation을 돌려준다. LLM은 Task Complete 시 Result로 이동한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0d9488"/></marker>
    <marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2563eb"/></marker>
  </defs>
  <style>
    .canvas{fill:#f8fafc}.node{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}.active{fill:#f0fdfa;stroke:#0d9488;stroke-width:1.5}
    text{fill:#0f172a;font:600 19px ui-sans-serif,system-ui,sans-serif;text-anchor:middle}
    .heading{font-size:26px;text-anchor:start}.eyebrow{fill:#0d9488;font:700 13px ui-monospace,monospace;letter-spacing:1.5px;text-anchor:start}
    .label{fill:#0d9488;font-size:16px}.return-label{fill:#2563eb;font-size:16px}
    .edge{fill:none;stroke:#0d9488;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .return{fill:none;stroke:#2563eb;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 5;marker-end:url(#return-arrow)}
  </style>
  <rect class="canvas" width="760" height="410" rx="20"/>
  <text class="eyebrow" x="32" y="36">AGENT · ACTION / OBSERVATION</text>
  <text class="heading" x="32" y="73">LLM decides the next action</text>
  <rect class="node" x="32" y="167" width="110" height="70" rx="12"/>
  <text x="87" y="209">Goal</text>
  <path class="edge" d="M142 202 H218"/>
  <rect class="active" x="220" y="167" width="140" height="70" rx="12"/>
  <text x="290" y="209">LLM</text>
  <path class="edge" d="M360 187 H538"/>
  <text class="label" x="450" y="172">Action</text>
  <rect class="node" x="540" y="167" width="188" height="70" rx="12"/>
  <text x="634" y="209">Environment</text>
  <path class="return" d="M540 217 H362"/>
  <text class="return-label" x="450" y="244">Observation</text>
  <path class="edge" d="M290 237 V326"/>
  <text class="label" x="384" y="289">Task Complete</text>
  <rect class="node" x="220" y="328" width="140" height="58" rx="12"/>
  <text x="290" y="364">Result</text>
</svg>
